# Only JBoss pods may talk MCMP (port 6666) to httpd.  Port 80 stays open.
# kube-router enforces NetworkPolicy in this cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: httpd-mcmp-only-from-jboss
spec:
  podSelector:
    matchLabels: { app: httpd }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 80, protocol: TCP }]
    - from:
        - podSelector:
            matchLabels: { app: jboss }
      ports: [{ port: 6666, protocol: TCP }]
